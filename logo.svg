<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Perfectly Balanced Typography -->
    <path id="curveTop" d="M 80 250 A 170 170 0 0 1 420 250" fill="none" />
    <path id="curveBottom" d="M 95 250 A 155 155 0 0 0 405 250" fill="none" />

    <!-- Shadows -->
    <filter id="softNeoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0F172A" flood-opacity="1" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Canvas Base -->
  <rect width="500" height="500" fill="none" />

  <!-- Main Neobrutalist Emblem Shell with Solid Offset Shadow -->
  <g filter="url(#softNeoShadow)">
    <!-- Base Outer Circular Badge -->
    <circle cx="250" cy="250" r="230" fill="#FFFFFF" stroke="#0F172A" stroke-width="6" />

    <!-- Inner Concentric Ring -->
    <circle cx="250" cy="250" r="216" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" stroke-dasharray="6, 4" />

    <!-- Solid Border Separator Ring -->
    <circle cx="250" cy="250" r="148" fill="#FFFFFF" stroke="#0F172A" stroke-width="4.5" />
  </g>

  <!-- Circular Outer Typography -->
  <!-- Top: ISTIQOMAH GROSIR -->
  <text fill="#0F172A" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      ISTIQOMAH GROSIR
    </textPath>
  </text>

  <!-- Bottom: BULUSARI · 3 LANTAI -->
  <text fill="#0F172A" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="23" letter-spacing="5">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging" dy="-8">
      BULUSARI • 3 LANTAI
    </textPath>
  </text>

  <!-- 8-Point Geometric Stars at 9 o'clock & 3 o'clock -->
  <g transform="translate(62, 250)">
    <polygon points="0,-10 2.8,-3 9.8,-3 4.2,1.2 6.4,8 0,4 -6.4,8 -4.2,1.2 -9.8,-3 -2.8,-3" fill="#D97706" stroke="#0F172A" stroke-width="1.8" />
  </g>
  <g transform="translate(438, 250)">
    <polygon points="0,-10 2.8,-3 9.8,-3 4.2,1.2 6.4,8 0,4 -6.4,8 -4.2,1.2 -9.8,-3 -2.8,-3" fill="#D97706" stroke="#0F172A" stroke-width="1.8" />
  </g>

  <!-- CENTER LOGO EMBLEM: 3-TIER ISOMETRIC WAREHOUSE & MONOGRAM -->
  <g id="centerEmblem">
    <!-- Center Soft Background Disc -->
    <circle cx="250" cy="250" r="142" fill="#0F172A" />
    <circle cx="250" cy="250" r="136" fill="#18181B" stroke="#334155" stroke-width="1.5" />

    <!-- Isometric 3-Tier Warehouse Layers (Lantai 1, Lantai 2, Lantai 3) -->
    <!-- Tier 1 (Base - Lantai 1): Width 140 -->
    <g transform="translate(0, 32)">
      <!-- Left Wall -->
      <polygon points="250,290 180,250 180,266 250,306" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
      <!-- Right Wall -->
      <polygon points="250,290 320,250 320,266 250,306" fill="#0F172A" stroke="#0F172A" stroke-width="2" />
      <!-- Top Floor Accent Line (L1 Blue) -->
      <line x1="180" y1="266" x2="250" y2="306" stroke="#3B82F6" stroke-width="3.5" />
      <line x1="320" y1="266" x2="250" y2="306" stroke="#2563EB" stroke-width="3.5" />
    </g>

    <!-- Tier 2 (Middle - Lantai 2): Width 120 -->
    <g transform="translate(0, 10)">
      <!-- Left Wall -->
      <polygon points="250,256 190,222 190,238 250,272" fill="#334155" stroke="#0F172A" stroke-width="2" />
      <!-- Right Wall -->
      <polygon points="250,256 310,222 310,238 250,272" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
      <!-- Top Floor Accent Line (L2 Emerald) -->
      <line x1="190" y1="238" x2="250" y2="272" stroke="#10B981" stroke-width="3.5" />
      <line x1="310" y1="238" x2="250" y2="272" stroke="#059669" stroke-width="3.5" />
    </g>

    <!-- Tier 3 (Top Cube - Lantai 3 with Crown) -->
    <g transform="translate(0, -14)">
      <!-- Left Wall -->
      <polygon points="250,222 200,194 200,210 250,238" fill="#475569" stroke="#0F172A" stroke-width="2" />
      <!-- Right Wall -->
      <polygon points="250,222 300,194 300,210 250,238" fill="#334155" stroke="#0F172A" stroke-width="2" />
      <!-- Top Floor Accent Line (L3 Amber) -->
      <line x1="200" y1="210" x2="250" y2="238" stroke="#F59E0B" stroke-width="3.5" />
      <line x1="300" y1="210" x2="250" y2="238" stroke="#D97706" stroke-width="3.5" />

      <!-- Isometric Top Face -->
      <polygon points="250,166 300,194 250,222 200,194" fill="url(#cubeTop)" stroke="#0F172A" stroke-width="3" />
    </g>

    <!-- Stylized Modern Geometric Monogram "IB" (White & Gold) -->
    <!-- Letter "I" & "B" Interlock In Center Face -->
    <g transform="translate(250, 246)">
      <!-- Monogram Base Pill -->
      <rect x="-42" y="-36" width="84" height="66" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.5" />

      <!-- Letter I (Left Bar with Gold Accent) -->
      <rect x="-30" y="-26" width="14" height="46" rx="3" fill="#0F172A" />
      <rect x="-30" y="-26" width="14" height="9" rx="2" fill="url(#goldGrad)" />

      <!-- Letter B (Spine and Double Loops) -->
      <path d="M -8 -26 L 14 -26 Q 26 -26 26 -14 Q 26 -3 14 -3 L -8 -3 Z" fill="#0F172A" stroke="#0F172A" stroke-width="1.5" />
      <path d="M -8 -3 L 16 -3 Q 30 -3 30 10 Q 30 20 16 20 L -8 20 Z" fill="#0F172A" stroke="#0F172A" stroke-width="1.5" />

      <!-- B Cutouts (White) -->
      <path d="M 2 -20 L 12 -20 Q 18 -20 18 -14 Q 18 -9 12 -9 L 2 -9 Z" fill="#FFFFFF" />
      <path d="M 2 3 L 14 3 Q 22 3 22 10 Q 22 14 14 14 L 2 14 Z" fill="#FFFFFF" />
    </g>

    <!-- Top Apex Crest: 8-Point Gold Star Rosette -->
    <g transform="translate(250, 142)">
      <polygon points="0,-14 4,-4 14,-4 6,2 9,12 0,6 -9,12 -6,2 -14,-4 -4,-4" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.8" />
      <circle cx="0" cy="1" r="3.5" fill="#FFFFFF" />
    </g>
  </g>
</svg>
